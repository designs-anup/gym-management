<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
/>

<title>Platform Settings</title>

<link
rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
/>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f4f7fc;
display:flex;
}

/* SIDEBAR */

.sidebar{
width:270px;
height:100vh;
background:linear-gradient(180deg,#0f172a,#1e3a8a);
color:#fff;
padding:25px 20px;
position:fixed;
overflow-y:auto;
}

.logo{
font-size:24px;
font-weight:bold;
text-align:center;
margin-bottom:35px;
}

.sidebar ul{
list-style:none;
}

.sidebar ul li{
margin-bottom:12px;
}

.sidebar ul li a{
display:flex;
align-items:center;
gap:12px;
padding:14px;
border-radius:14px;
text-decoration:none;
color:#fff;
transition:.3s;
}

.sidebar ul li.active a,
.sidebar ul li a:hover{
background:rgba(255,255,255,.15);
}

/* MAIN */

.main{
margin-left:270px;
width:calc(100% - 270px);
padding:30px;
}

.topbar{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:25px;
}

.page-title{
font-size:32px;
font-weight:bold;
color:#111827;
}

.profile{
background:#fff;
padding:12px 20px;
border-radius:15px;
display:flex;
align-items:center;
gap:10px;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

/* CARD */

.card{
background:#fff;
padding:30px;
border-radius:20px;
box-shadow:0 5px 20px rgba(0,0,0,.08);
margin-bottom:25px;
}

.card-title{
font-size:24px;
font-weight:bold;
margin-bottom:20px;
color:#1e3a8a;
}

/* FORM */

.form-grid{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(280px,1fr));
gap:20px;
}

.input-group{
display:flex;
flex-direction:column;
}

.input-group label{
font-weight:600;
margin-bottom:8px;
color:#374151;
}

.input-group input,
.input-group select,
.input-group textarea{
padding:14px;
border:1px solid #d1d5db;
border-radius:12px;
outline:none;
font-size:15px;
}

textarea{
resize:none;
height:100px;
}

.logo-upload{
border:2px dashed #cbd5e1;
padding:30px;
border-radius:15px;
text-align:center;
background:#f8fafc;
cursor:pointer;
}

.logo-upload i{
font-size:35px;
color:#2563eb;
margin-bottom:10px;
}

.toggle-group{
display:flex;
gap:15px;
margin-top:10px;
}

.toggle-btn{
padding:12px 18px;
border:none;
border-radius:12px;
background:#e5e7eb;
cursor:pointer;
font-weight:600;
}

.toggle-btn.active{
background:#2563eb;
color:#fff;
}

/* BUTTON */

.save-btn{
background:
linear-gradient(90deg,#2563eb,#1d4ed8);
color:#fff;
border:none;
padding:15px 30px;
border-radius:14px;
font-size:16px;
font-weight:bold;
cursor:pointer;
margin-top:25px;
transition:.3s;
}

.save-btn:hover{
transform:translateY(-2px);
}

/* RESPONSIVE */

@media(max-width:900px){

.sidebar{
width:80px;
}

.sidebar span{
display:none;
}

.main{
margin-left:80px;
width:calc(100% - 80px);
}

}
</style>
</head>

<body>

<!-- SIDEBAR -->

<div class="sidebar">

<div class="logo">
<i class="fas fa-dumbbell"></i>
Gym SaaS
</div>

<ul>

<li>
<a href="#">
<i class="fas fa-chart-pie"></i>
<span>Dashboard</span>
</a>
</li>

<li>
<a href="#">
<i class="fas fa-building"></i>
<span>Gyms</span>
</a>
</li>

<li>
<a href="#">
<i class="fas fa-wallet"></i>
<span>Revenue</span>
</a>
</li>

<li class="active">
<a href="#">
<i class="fas fa-cog"></i>
<span>Settings</span>
</a>
</li>

</ul>

</div>

<!-- MAIN -->

<div class="main">

<div class="topbar">

<h1 class="page-title">
Platform Settings
</h1>

<div class="profile">
<i class="fas fa-user-circle fa-2x"></i>
<span>Super Admin</span>
</div>

</div>

<!-- GENERAL SETTINGS -->

<div class="card">

<div class="card-title">
General Settings
</div>

<div class="form-grid">

<div class="input-group">
<label>Platform Name</label>
<input
type="text"
placeholder="Gym SaaS Platform"
/>
</div>

<div class="input-group">
<label>Currency</label>
<select>
<option>INR (₹)</option>
<option>USD ($)</option>
<option>EUR (€)</option>
<option>GBP (£)</option>
</select>
</div>

<div class="input-group">
<label>Timezone</label>
<select>
<option>Asia/Kolkata</option>
<option>UTC</option>
<option>America/New_York</option>
<option>Europe/London</option>
</select>
</div>

<div class="input-group">
<label>Tax Rule (%)</label>
<input
type="number"
placeholder="18"
/>
</div>

</div>

</div>

<!-- BRANDING -->

<div class="card">

<div class="card-title">
Branding
</div>

<div class="form-grid">

<div class="input-group">
<label>Brand Logo</label>

<div class="logo-upload">
<i class="fas fa-cloud-upload-alt"></i>
<p>Upload Logo</p>
</div>

</div>

<div class="input-group">
<label>Theme Settings</label>

<div class="toggle-group">
<button class="toggle-btn active">
Light
</button>

<button class="toggle-btn">
Dark
</button>

<button class="toggle-btn">
System
</button>
</div>

</div>

</div>

</div>

<!-- SMTP -->

<div class="card">

<div class="card-title">
SMTP Email Setup
</div>

<div class="form-grid">

<div class="input-group">
<label>SMTP Host</label>
<input
type="text"
placeholder="smtp.gmail.com"
/>
</div>

<div class="input-group">
<label>Port</label>
<input
type="number"
placeholder="587"
/>
</div>

<div class="input-group">
<label>Email Address</label>
<input
type="email"
placeholder="admin@gym.com"
/>
</div>

<div class="input-group">
<label>Password</label>
<input
type="password"
/>
</div>

</div>

</div>

<!-- SMS -->

<div class="card">

<div class="card-title">
SMS Gateway Setup
</div>

<div class="form-grid">

<div class="input-group">
<label>Provider</label>
<select>
<option>Twilio</option>
<option>MSG91</option>
<option>TextLocal</option>
</select>
</div>

<div class="input-group">
<label>API Key</label>
<input
type="text"
placeholder="Enter API Key"
/>
</div>

</div>

</div>

<!-- PAYMENT -->

<div class="card">

<div class="card-title">
Payment Gateway Keys
</div>

<div class="form-grid">

<div class="input-group">
<label>Razorpay Key</label>
<input
type="text"
placeholder="rzp_xxxxxxxxx"
/>
</div>

<div class="input-group">
<label>Stripe Secret Key</label>
<input
type="text"
placeholder="sk_live_xxxxx"
/>
</div>

<div class="input-group">
<label>PayPal Client ID</label>
<input
type="text"
/>
</div>

</div>

</div>

<!-- STORAGE -->

<div class="card">

<div class="card-title">
Storage Settings
</div>

<div class="form-grid">

<div class="input-group">
<label>Storage Provider</label>
<select>
<option>Supabase Storage</option>
<option>AWS S3</option>
<option>Cloudinary</option>
</select>
</div>

<div class="input-group">
<label>Bucket Name</label>
<input
type="text"
placeholder="gym-assets"
/>
</div>

<div class="input-group">
<label>CDN URL</label>
<input
type="text"
placeholder="https://cdn.example.com"
/>
</div>

</div>

<button class="save-btn">
Save Settings
</button>

</div>

</div>

</body>
</html>
