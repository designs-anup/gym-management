<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Trainer | Fit App</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet"
    href="styles.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <i class="fas fa-dumbbell"></i>
            <span>Fit App</span>
        </div>

        <ul class="menu">

            <li>
                <a href="index.html">
                    <i class="fas fa-home"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="members.html">
                    <i class="fas fa-users"></i>
                    Members
                </a>
            </li>

            <li>
                <a href="trainers.html"
                   class="active">
                    <i class="fas fa-user-tie"></i>
                    Trainers
                </a>
            </li>

            <li>
                <a href="workout-plans.html">
                    <i class="fas fa-dumbbell"></i>
                    Workout Plans
                </a>
            </li>

            <li>
                <a href="membership-plans.html">
                    <i class="fas fa-id-card"></i>
                    Membership Plans
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main -->
    <div class="main-content">

        <!-- Header -->
        <header class="topbar">

            <div class="top-left">

                <button id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>

                <div>
                    <h1>Edit Trainer</h1>
                    <p>
                        Update trainer information
                    </p>
                </div>

            </div>

            <div class="profile-card">

                <div class="profile-info">
                    <h4>Admin User</h4>
                    <small>
                        admin@mygym.com
                    </small>
                </div>

                <img
                src="https://i.pravatar.cc/100?img=12"
                alt="profile">

            </div>

        </header>

        <!-- Form -->
        <main>

            <section class="card form-card">

                <div class="form-header">
                    <h2>Edit Trainer</h2>
                    <p>
                        Modify trainer details
                    </p>
                </div>

                <form class="member-form">

                    <!-- Upload -->
                    <div class="upload-box">

                        <img
                        src=
                        "https://i.pravatar.cc/120?img=30"
                        alt="trainer"
                        class=
                        "member-avatar">

                        <div>

                            <label
                            class="upload-btn">

                                Change Photo

                                <input
                                type="file"
                                hidden>

                            </label>

                            <p>
                                JPG or PNG
                                (Max 5MB)
                            </p>

                        </div>

                    </div>

                    <!-- Form Grid -->
                    <div class="form-grid">

                        <div class="input-group">
                            <label>
                                Full Name
                            </label>

                            <input
                            type="text"
                            value="Michael Lee"
                            required>
                        </div>

                        <div class="input-group">
                            <label>
                                Email Address
                            </label>

                            <input
                            type="email"
                            value="mike@gym.com"
                            required>
                        </div>

                        <div class="input-group">
                            <label>
                                Phone Number
                            </label>

                            <input
                            type="tel"
                            value="+91 9876543210">
                        </div>

                        <div class="input-group">
                            <label>
                                Gender
                            </label>

                            <select>
                                <option selected>
                                    Male
                                </option>

                                <option>
                                    Female
                                </option>
                            </select>
                        </div>

                        <div class="input-group">
                            <label>
                                Specialization
                            </label>

                            <select>

                                <option selected>
                                    Strength Training
                                </option>

                                <option>
                                    Yoga
                                </option>

                                <option>
                                    Cardio
                                </option>

                                <option>
                                    Weight Loss
                                </option>

                                <option>
                                    CrossFit
                                </option>

                            </select>
                        </div>

                        <div class="input-group">
                            <label>
                                Experience
                            </label>

                            <input
                            type="number"
                            value="5">
                        </div>

                        <div class="input-group">
                            <label>
                                Salary
                            </label>

                            <input
                            type="number"
                            value="50000">
                        </div>

                        <div class="input-group">
                            <label>
                                Availability
                            </label>

                            <select>

                                <option selected>
                                    Full Time
                                </option>

                                <option>
                                    Part Time
                                </option>

                            </select>
                        </div>

                        <div class=
                        "input-group full-width">

                            <label>
                                Address
                            </label>

                            <textarea
                            rows="4">Bhubaneswar, Odisha</textarea>

                        </div>

                    </div>

                    <!-- Actions -->
                    <div class="form-actions">

                        <a href=
                        "trainers.html"
                        class=
                        "btn-secondary">

                            Cancel

                        </a>

                        <button
                        type="submit"
                        class=
                        "btn-primary">

                            Update Trainer

                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</div>

<script>
const menuBtn =
document.getElementById(
'menuBtn'
);

const sidebar =
document.getElementById(
'sidebar'
);

menuBtn.addEventListener(
'click',
()=>{
sidebar.classList.toggle(
'active'
);
});
</script>

</body>
</html>
