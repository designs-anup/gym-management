<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Workout Plan | Fit App</title>

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <link rel="stylesheet"
    href="styles.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <i class="fas fa-dumbbell"></i>
            <span>Fit App</span>
        </div>

        <ul class="menu">

            <li>
                <a href="index.html">
                    <i class="fas fa-home"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="members.html">
                    <i class="fas fa-users"></i>
                    Members
                </a>
            </li>

            <li>
                <a href="trainers.html">
                    <i class="fas fa-user-tie"></i>
                    Trainers
                </a>
            </li>

            <li>
                <a href="workout-plans.html"
                   class="active">
                    <i class="fas fa-dumbbell"></i>
                    Workout Plans
                </a>
            </li>

            <li>
                <a href="membership-plans.html">
                    <i class="fas fa-id-card"></i>
                    Membership Plans
                </a>
            </li>

            <li>
                <a href="membership-tracking.html">
                    <i class="fas fa-chart-line"></i>
                    Membership Tracking
                </a>
            </li>

            <li>
                <a href="payments-billing.html">
                    <i class="fas fa-wallet"></i>
                    Payments
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main -->
    <div class="main-content">

        <!-- Header -->
        <header class="topbar">

            <div class="top-left">

                <button id="menuBtn">
                    <i class="fas fa-bars"></i>
                </button>

                <div>
                    <h1>
                        Edit Workout Plan
                    </h1>

                    <p>
                        Update workout details
                    </p>
                </div>

            </div>

            <div class="profile-card">

                <div class="profile-info">
                    <h4>Admin User</h4>
                    <small>
                        admin@mygym.com
                    </small>
                </div>

                <img
                src="https://i.pravatar.cc/100?img=12"
                alt="profile">

            </div>

        </header>

        <!-- Content -->
        <main>

            <section
            class="card form-card">

                <div class=
                "form-header">

                    <h2>
                        Workout Information
                    </h2>

                    <p>
                        Modify workout plan
                    </p>

                </div>

                <form
                class="member-form">

                    <div
                    class="form-grid">

                        <div
                        class="input-group">

                            <label>
                                Workout Name
                            </label>

                            <input
                            type="text"
                            value=
                            "Full Body Strength"
                            required>

                        </div>

                        <div
                        class="input-group">

                            <label>
                                Category
                            </label>

                            <select>

                                <option selected>
                                    Strength
                                </option>

                                <option>
                                    Cardio
                                </option>

                                <option>
                                    Yoga
                                </option>

                                <option>
                                    CrossFit
                                </option>

                            </select>

                        </div>

                        <div
                        class="input-group">

                            <label>
                                Difficulty
                            </label>

                            <select>

                                <option selected>
                                    Beginner
                                </option>

                                <option>
                                    Intermediate
                                </option>

                                <option>
                                    Advanced
                                </option>

                            </select>

                        </div>

                        <div
                        class="input-group">

                            <label>
                                Duration
                            </label>

                            <input
                            type="text"
                            value=
                            "45 Minutes">

                        </div>

                        <div
                        class="input-group">

                            <label>
                                Calories Burn
                            </label>

                            <input
                            type="number"
                            value="300">

                        </div>

                        <div
                        class=
                        "input-group">

                            <label>
                                Assigned Trainer
                            </label>

                            <select>

                                <option selected>
                                    Michael Lee
                                </option>

                                <option>
                                    Sarah Kim
                                </option>

                                <option>
                                    David Smith
                                </option>

                            </select>

                        </div>

                        <div
                        class=
                        "input-group full-width">

                            <label>
                                Description
                            </label>

                            <textarea
                            rows="5">Build muscle strength using compound movements and resistance exercises for a complete body workout.</textarea>

                        </div>

                    </div>

                    <!-- Actions -->
                    <div
                    class="form-actions">

                        <a href=
                        "workout-plans.html"
                        class=
                        "btn-secondary">

                            Cancel

                        </a>

                        <button
                        type="submit"
                        class=
                        "btn-primary">

                            Update Workout

                        </button>

                    </div>

                </form>

            </section>

        </main>

    </div>

</div>

<script>
const menuBtn =
document.getElementById(
'menuBtn'
);

const sidebar =
document.getElementById(
'sidebar'
);

menuBtn.addEventListener(
'click',
()=>{
sidebar.classList.toggle(
'active'
);
});
</script>

</body>
</html>
